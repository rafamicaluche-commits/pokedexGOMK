<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex GO - Info de Evolução</title>
    <style>
        :root {
            --primary-color: #e3350d;
            --primary-dark: #b52a0a;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --accent-color: #ffcb05;
            --accent-dark: #e6b800;
            --danger-color: #e74c3c;
        }

        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }

        .pokedex-container {
            background-color: var(--card-bg);
            border-radius: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        /* Cabeçalho estilo App */
        .pokedex-header {
            background-color: var(--primary-color);
            padding: 24px 20px 20px 20px;
            text-align: center;
            color: white;
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Sistema de Abas Modernizado */
        .tabs {
            display: flex;
            background-color: rgba(0, 0, 0, 0.15);
            padding: 4px;
            border-radius: 12px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            color: rgba(255, 255, 255, 0.8);
            border: none;
            padding: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-radius: 9px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--card-bg);
            color: var(--primary-color);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* Conteúdo Principal */
        .pokedex-body {
            padding: 20px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Caixa de Busca */
        .search-box {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
            -moz-appearance: textfield;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"]:focus {
            border-color: var(--primary-color);
        }

        .btn-main {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 14px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-main:hover, .btn-main:active {
            background-color: var(--primary-dark);
        }

        /* Telas de Exibição / Resultados */
        .result-screen {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 18px;
            min-height: 160px;
            border: 1px solid #edf2f7;
            box-sizing: border-box;
        }

        .placeholder-text {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            padding: 40px 10px;
            line-height: 1.5;
        }

        /* Informações do Pokémon */
        .info-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .poke-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .info-row {
            margin-bottom: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-weight: 700;
            color: #4a5568;
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .value {
            color: var(--text-main);
        }

        hr {
            border: 0;
            height: 1px;
            background: #edf2f7;
            margin: 14px 0;
        }

        /* Botões de Ação */
        .btn-save {
            background-color: var(--accent-color);
            color: #222;
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-save:hover {
            background-color: var(--accent-dark);
        }

        .btn-save:active {
            transform: scale(0.95);
        }

        .btn-remove {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            transition: all 0.2s;
            width: auto;
        }

        .btn-remove:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .error {
            color: var(--danger-color);
            font-weight: 600;
            text-align: center;
            padding: 30px 10px;
        }

        /* Itens na Lista da Biblioteca */
        .library-scroll {
            max-height: 380px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .library-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .library-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        .library-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-left: 5px solid var(--accent-color);
            padding: 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .library-item:last-child {
            margin-bottom: 0;
        }
    </style>
</head>

            <div class="tabs">

        // Alternar entre as Abas
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'busca') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('tab-busca').classList.add('active');
            } else if (tabName === 'biblioteca') {
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('tab-biblioteca').classList.add('active');
                renderBiblioteca();
            }
        }

        // Buscar Pokémon por Número
        function buscarPokemon() {
            const numero = String(document.getElementById("pokeNumber").value).trim();
            const telaResultado = document.getElementById("resultado");

            if (!numero || numero === "0") {
                telaResultado.innerHTML = '<div class="error">Por favor, digite um número válido!</div>';
                return;
            }

            const poke = pokemonDB[numero];

            if (poke) {
                telaResultado.innerHTML = `
                    <div class="info-header">
                        <span class="poke-title">#${numero} - ${poke.nome}</span>
                        <button class="btn-save" onclick="salvarNaBiblioteca('${numero}')">⭐ Salvar</button>
                    </div>
                    <hr>
                    <div class="info-row">
                        <span class="label">Antecessora</span>
                        <span class="value">${poke.anteEvolucao}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Doces Necessários</span>
                        <span class="value">${poke.doces}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Como Obter / Notas adicionais</span>
                        <span class="value">${poke.metodo}</span>
                    </div>
                `;
            } else {
                telaResultado.innerHTML = `
                    <div class="error">
                        Pokémon #${numero} ainda não foi cadastrado no sistema.
                    </div>
                `;
            }
        }

        // Salvar na biblioteca (LocalStorage)
        function salvarNaBiblioteca(numero) {
            let biblioteca = JSON.parse(localStorage.getItem('pokeBiblioteca')) || [];
            
            if (!biblioteca.includes(numero)) {
                biblioteca.push(numero);
                localStorage.setItem('pokeBiblioteca', JSON.stringify(biblioteca));
                alert(`${pokemonDB[numero].nome} foi adicionado à sua Biblioteca!`);
            } else {
                alert('Este Pokémon já se encontra salvo na sua biblioteca!');
            }
        }

        // Remover da biblioteca
        function removerDaBiblioteca(numero) {
            let biblioteca = JSON.parse(localStorage.getItem('pokeBiblioteca')) || [];
            biblioteca = biblioteca.filter(id => id !== numero);
            localStorage.setItem('pokeBiblioteca', JSON.stringify(biblioteca));
            renderBiblioteca();
        }

        // Mostrar os itens salvos na aba Biblioteca
        function renderBiblioteca() {
            const container = document.getElementById('biblioteca-lista');
            let biblioteca = JSON.parse(localStorage.getItem('pokeBiblioteca')) || [];

            if (biblioteca.length === 0) {
                container.innerHTML = `
                    <div class="placeholder-text">
                        Sua biblioteca está vazia.<br>Guarde seus Pokémons favoritos na aba de busca!
                    </div>`;
                return;
            }

            container.innerHTML = '';
            // Ordenar por número para ficar organizado
            biblioteca.sort((a, b) => Number(a) - Number(b));

            biblioteca.forEach(numero => {
                const poke = pokemonDB[numero];
                if (poke) {
                    container.innerHTML += `
                        <div class="library-item">
                            <div style="font-weight: 700; font-size: 15px; color: var(--text-main);">#${numero} - ${poke.nome}</div>
                            <div style="font-size: 13px; margin: 6px 0; color: #555;">
                                <b>Evolução:</b> ${poke.anteEvolucao} | <b>Doces:</b> ${poke.doces}
                            </div>
                            <div style="font-size: 13px; color: var(--text-muted); line-height: 1.4;">${poke.metodo}</div>
                            <button class="btn-remove" onclick="removerDaBiblioteca('${numero}')">Excluir</button>
                        </div>
                    `;
                }
            });
        }
    </script>
